services:
  postgres:
    image: postgres:16-alpine
    container_name: issueflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: issueflow
      POSTGRES_PASSWORD: issueflow_dev_password
      POSTGRES_DB: issueflow
    ports:
      - "5432:5432"
    volumes:
      - issueflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issueflow -d issueflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: issueflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - issueflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  issueflow_pgdata:
  issueflow_redisdata:
