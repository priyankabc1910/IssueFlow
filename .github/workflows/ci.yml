name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://issueflow:issueflow_dev_password@localhost:5432/issueflow?schema=public
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      REDIS_URL: redis://localhost:6379
    env:
      DATABASE_URL: postgresql://issueflow:issueflow_dev_password@localhost:5432/issueflow?schema=public
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run db:generate
      - run: npm run build
      - run: npm test
